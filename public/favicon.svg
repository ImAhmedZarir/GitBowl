<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- GitBowl Vibrant Blue App Icon Container -->
  <rect width="512" height="512" rx="112" fill="#3B82F6"/>
  
  <!-- Git nodes (upper circles) -->
  <circle cx="170" cy="130" r="46" stroke="#FFFFFF" stroke-width="32" fill="none"/>
  <circle cx="342" cy="130" r="46" stroke="#FFFFFF" stroke-width="32" fill="none"/>
  
  <!-- Horizontal connecting branch bar -->
  <line x1="216" y1="130" x2="296" y2="130" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round"/>
  
  <!-- Vertical stems down into the bowl -->
  <line x1="170" y1="176" x2="170" y2="228" stroke="#FFFFFF" stroke-width="32" stroke-linecap="square"/>
  <line x1="342" y1="176" x2="342" y2="228" stroke="#FFFFFF" stroke-width="32" stroke-linecap="square"/>
  
  <!-- Half-circle bowl -->
  <path d="M54 224 H458 C458 335.5 367.5 426 256 426 C144.5 426 54 335.5 54 224 Z" fill="#FFFFFF"/>
</svg>
